      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordBlue" x1="0" y1="0" x2="1" y2="0">
